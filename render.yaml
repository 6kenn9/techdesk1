databases:
  - name: techdesk-db
    plan: free
    databaseName: techdesk
    user: techdesk

services:
  - type: web
    name: techdesk-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_URL
        value: https://techdesk-gd1r.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false

  - type: web
    name: techdesk
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://techdesk-api-rf1k.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
